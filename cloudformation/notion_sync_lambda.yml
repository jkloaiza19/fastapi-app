AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lambda to sync Notion DB pages into Astra DB (vector store)'

Parameters:
  ArtifactS3Bucket:
    Type: String
    Description: S3 bucket where the Lambda deployment zip is uploaded
  ArtifactS3Key:
    Type: String
    Description: S3 key (path) to the uploaded zip artifact (e.g. notion_sync_lambda.zip)
  NotionDatabaseId:
    Type: String
    Description: Notion database id to sync
  NotionSecretArn:
    Type: String
    Description: (Optional) Secrets Manager ARN that contains Notion token (can be empty string)
    Default: ""
  OpenAISecretArn:
    Type: String
    Description: (Optional) Secrets Manager ARN that contains OpenAI API key
    Default: ""
  AstraSecretArn:
    Type: String
    Description: (Optional) Secrets Manager ARN that contains Astra token
    Default: ""
  AstraEndpoint:
    Type: String
    Description: Astra DB endpoint URL

Resources:
  NotionSyncLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NotionSyncAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${ArtifactS3Bucket}/${ArtifactS3Key}
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref NotionSecretArn
                  - !Ref OpenAISecretArn
                  - !Ref AstraSecretArn

  NotionSyncLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: notion-sync-lambda
      Handler: lambda_handler.handler
      Runtime: python3.11
      Role: !GetAtt NotionSyncLambdaRole.Arn
      Code:
        S3Bucket: !Ref ArtifactS3Bucket
        S3Key: !Ref ArtifactS3Key
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          NOTION_DATABASE_ID: !Ref NotionDatabaseId
          NOTION_SECRET_ARN: !Ref NotionSecretArn
          OPENAI_SECRET_ARN: !Ref OpenAISecretArn
          ASTRA_SECRET_ARN: !Ref AstraSecretArn
          ASTRA_DB_ENDPOINT: !Ref AstraEndpoint

  # Optional: Example scheduled invocation via EventBridge (run daily at 01:00 UTC)
  NotionSyncScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: notion-sync-schedule
      ScheduleExpression: rate(24 hours)
      State: ENABLED
      Targets:
        - Arn: !GetAtt NotionSyncLambda.Arn
          Id: NotionSyncLambdaTarget

  NotionSyncSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotionSyncLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NotionSyncScheduleRule.Arn

Outputs:
  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref NotionSyncLambda
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt NotionSyncLambda.Arn
