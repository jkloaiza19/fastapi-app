name: Auto PR to Staging

on:
  push:
    branches:
      - develop

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if staging branch exists
        id: check-staging
        run: |
          if git ls-remote --heads origin staging | grep -q staging; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Staging branch does not exist. Skipping PR creation."
          fi

      - name: Check if PR already exists
        if: steps.check-staging.outputs.exists == 'true'
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head develop --base staging --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "number=$EXISTING_PR" >> $GITHUB_OUTPUT
            echo "::notice::PR #$EXISTING_PR already exists from develop to staging"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-staging.outputs.exists == 'true' && steps.check-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base staging \
            --head develop \
            --title "🚀 Auto-merge develop → staging" \
            --body "## Automated PR from develop to staging

          This PR was automatically created after changes were merged into \`develop\`.

          ### Recent Changes
          - Commit: \`${{ github.sha }}\`
          - Author: @${{ github.actor }}
          - Message: ${{ github.event.head_commit.message }}

          ### Checklist
          - [ ] All tests passing in develop
          - [ ] Code review completed
          - [ ] Ready to deploy to staging environment

          ### Deployment
          Once merged, this will trigger deployment to the **staging** environment.

          ---
          _Automated by GitHub Actions_" \
            --assignee "${{ github.actor }}" || true
          
          # Add labels if they exist (ignore errors if they don't)
          PR_NUMBER=$(gh pr list --head develop --base staging --state open --json number --jq '.[0].number')
          gh pr edit "$PR_NUMBER" --add-label "staging" 2>/dev/null || echo "Label 'staging' not found, skipping"
          gh pr edit "$PR_NUMBER" --add-label "auto-merge" 2>/dev/null || echo "Label 'auto-merge' not found, skipping"
          gh pr edit "$PR_NUMBER" --add-label "deployment" 2>/dev/null || echo "Label 'deployment' not found, skipping"

      - name: Update existing PR
        if: steps.check-staging.outputs.exists == 'true' && steps.check-pr.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ steps.check-pr.outputs.number }} --body "🔄 **New changes detected in develop branch**

          - Commit: \`${{ github.sha }}\`
          - Author: @${{ github.actor }}
          - Message: ${{ github.event.head_commit.message }}

          _Updated by GitHub Actions_"
