name: Auto PR to Staging

on:
  push:
    branches:
      - develop

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if staging branch exists
        id: check-staging
        run: |
          if git ls-remote --heads origin staging | grep -q staging; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Staging branch does not exist. Skipping PR creation."
          fi

      - name: Create Pull Request
        if: steps.check-staging.outputs.exists == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: develop
          base: staging
          title: "🚀 Auto-merge develop → staging"
          body: |
            ## Automated PR from develop to staging
            
            This PR was automatically created after changes were merged into `develop`.
            
            ### Recent Changes
            - Merged PR: ${{ github.event.head_commit.message }}
            - Commit: ${{ github.sha }}
            - Author: @${{ github.actor }}
            
            ### Checklist
            - [ ] All tests passing in develop
            - [ ] Code review completed
            - [ ] Ready to deploy to staging environment
            
            ### Deployment
            Once merged, this will trigger deployment to the **staging** environment.
            
            ---
            _Automated by GitHub Actions_
          labels: |
            staging
            auto-merge
            deployment
          assignees: ${{ github.actor }}
          draft: false

      - name: Comment on triggering commit
        if: steps.check-staging.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `✅ Auto-PR to staging created successfully!\n\nView the PR: ${{ github.server_url }}/${{ github.repository }}/pulls`;
            console.log(message);
