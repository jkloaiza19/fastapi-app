version: 0.2

env:
  variables:
    SECRETS_ID: "test"

phases:
  install:
    runtime-versions:
      python: 3.11
      docker: 23
    commands:
      - echo "Installing system dependencies..."
      - yum install -y gcc libffi-devel bzip2 bzip2-devel zlib-devel openssl openssl-devel ncurses nc

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - echo Fetching secrets from AWS Secrets Manager...
      - export SECRETS_JSON=$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --query SecretString --output text)

      - echo Generating .env file for application...
      - echo "$SECRETS_JSON" | jq -r 'to_entries|map("export \(.key)=\(.value|tostring)")|.[]' >> .env

      - echo Generating image tag...
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}

  build:
    commands:
      - echo Building the Docker image...
      - docker build --tag=$REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Checking branch name..."
      - export BRANCH_NAME=${CODEBUILD_WEBHOOK_HEAD_REF#refs/heads/}
      - echo "Current branch is $BRANCH_NAME"
      
      - |
        if [[ "$BRANCH_NAME" == "develop" ]] || [[ "$BRANCH_NAME" == "staging" ]] || [[ "$BRANCH_NAME" == "production" ]] || [[ "$BRANCH_NAME" == "main" ]]; then
          echo "Branch $BRANCH_NAME is a deployment branch. Proceeding with image push and service update..."
          
          echo Pushing the Docker image to Amazon ECR...
          docker push $REPOSITORY_URI:$IMAGE_TAG
          docker push $REPOSITORY_URI:latest

          echo Writing image definitions file for CodePipeline...
          printf '[{"name":"%s","imageUri":"%s"}]' "$ECS_SERVICE" "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

          echo Updating ECS service to use the new task definition...
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
          
          echo "✅ Deployment completed successfully!"
        else
          echo "Branch $BRANCH_NAME is not a deployment branch. Skipping image push and service update."
          echo "Build completed successfully but image was not deployed."
          
          # Create empty artifacts file to satisfy CodePipeline if needed
          echo '[]' > imagedefinitions.json
        fi

artifacts:
  files:
    - imagedefinitions.json
    
